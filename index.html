            placeholder="0.5" value="${this.state.chipRate||''}"
            oninput="app.onChipRateInput(this.value)" onblur="app.onChipRateBlur()">
          <div style="font-size:14px;color:var(--muted);">₹/chip</div>
        </div>
        ${this.pbtn(can?`Start Game → ${ps.length} Players`:'Add at least 2 players',`app.goTo('game')`,{disabled:!can})}
      </div>`;
  }
}

// ══ GameRenderer — compact one-line rows ══════════════════════════════════
class GameRenderer extends BaseRenderer {
  render(){
    const rows=this.state.players.map(p=>this._playerRow(p)).join('');
    const activeCnt=this.state.activePlayers.length;
    return`${this.navBar()}<div class="body">${rows}</div>
      <div class="foot">${this.pbtn('Done — Set Expenses →',"app.goTo('expenses')")}</div>`;
  }

  _playerRow(p){
    const isExpanded = this.state.expandedPlayer===p.id;
    const isExiting  = this.state.exitingPlayer===p.id;
    const rate=this.state.chipRate; const pills = p.buys.map(b=>`<span class="pill"><span style="color:${p.color};font-weight:700;">${b.amount.toLocaleString()}</span><span style="color:var(--muted);font-size:12px;"> chips</span><span class="px" onclick="app.removeBuy(${p.id},${b.id})">✕</span></span>`).join('');

    const exitedBadge = p.exited ? `<span class="exited-badge">exited</span>` : '';

    // Main one-liner
    const mainRow=`
      <div class="prow-main" onclick="app.toggleExpand(${p.id})" style="cursor:pointer;">
        <div class="prow-top">
          <div class="prow-name">${this.esc(p.name)}${exitedBadge}</div>
          <div class="prow-stats">${p.buyCount>0?`${p.buyCount}× · <span style="color:${p.color};font-weight:700;">${p.totalBought.toLocaleString()} chips</span>`:'<span style="color:var(--brd2);">no buys</span>'}</div>
        </div>
      </div>`;

    const addBtn = p.exited ? '' : `<button class="prow-add" onclick="event.stopPropagation();app.addBuyPrompt(${p.id})" title="Add buy">+</button>`;
    const exitBtn = p.exited ? '' : `<button class="prow-exit" onclick="event.stopPropagation();app.startExit(${p.id})">Exit</button>`;

    // Expanded detail: buy pills + inline input + exit panel
    let detail = '';
    if(isExpanded && !p.exited){
      detail=`<div class="prow-detail">
        ${pills?`<div class="strip">${pills}</div>`:''}
        <div class="buy-inp-row">
          <input id="bi${p.id}" type="number" class="inp sm f1" placeholder="chips" value="${this.esc(this.state.buyDraft[p.id]||'')}">
          <button class="sbtn green" onclick="app.addBuy(${p.id})" style="padding:7px 13px;">+ Buy</button>
        </div>
        ${isExiting?this._exitPanel(p):''}
      </div>`;
    } else if(isExpanded && p.exited){
      const isEditingExit=this.state.editingExitPlayer===p.id;
      // Find existing exit payment for this player
      const existingEp=(this.state.exitPayments||[]).find(ep=>ep.fromId===p.id);
      detail=`<div class="prow-detail">
        ${pills?`<div class="strip">${pills}</div>`:''}
        ${isEditingExit
          ? this._editExitPanel(p, existingEp)
          : `<div style="display:flex;align-items:center;gap:8px;padding:2px 0;">
              <span style="font-size:13px;color:var(--muted);">Exited with <span style="color:var(--text);font-weight:700;">${p.exitChips.toLocaleString()} chips</span>${existingEp?` · paid ₹${existingEp.amount.toLocaleString()} to ${this.esc(existingEp.toName)}`:''}</span>
              <button class="sbtn green" onclick="event.stopPropagation();app.startEditExit(${p.id})" style="padding:4px 10px;font-size:12px;margin-left:auto;">Edit</button>
            </div>`
        }
      </div>`;
    }

    return`<div class="prow ${p.exited?'exited':''}">
      <div class="prow-accent" style="background:${p.color};"></div>
      ${mainRow}
      ${addBtn}${exitBtn}
    </div>${detail?`<div style="background:var(--bg2);border:1px solid var(--brd);border-top:none;border-radius:0 0 10px 10px;margin-top:-8px;margin-bottom:8px;">${detail}</div>`:''}`;
  }

  _editExitPanel(p, existingEp){
    // Pre-fill with current values for correction
    const others=this.state.players.filter(q=>q.id!==p.id);
    const otherOpts=['<option value="">— No cash payment —</option>']
      .concat(others.map(q=>`<option value="${q.id}" ${existingEp&&existingEp.toId===q.id?'selected':''}>${this.esc(q.name)}</option>`))
      .join('');
    const existingAmt=existingEp?existingEp.amount:'';

    return`<div class="exit-panel" style="border-color:var(--amber);">
      <div class="exit-label" style="color:var(--amber);">Editing exit — correct details below</div>
      <div class="exit-row">
        <input id="exitedit${p.id}" type="number" class="inp sm f1" placeholder="Chips remaining"
          value="${p.exitChips||''}">
        <button class="sbtn green" onclick="app.confirmEditExit(${p.id})">Save</button>
        <button class="sbtn red" onclick="app.cancelEditExit()">✕</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px;">
        Bought ${p.totalBought.toLocaleString()} chips
      </div>
      ${others.length?`<div style="margin-top:6px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Cash paid to (optional):</div>
        <div style="display:flex;gap:6px;">
          <select id="exitEditPayTo${p.id}" class="inp sm f1" style="color:var(--text);">${otherOpts}</select>
          <input id="exitEditPayAmt${p.id}" type="number" class="inp sm" style="width:80px;" placeholder="₹" value="${existingAmt}">
        </div>
      </div>`:''}
    </div>`;
  }

  _exitPanel(p){
    const others=this.state.players.filter(q=>q.id!==p.id&&!q.exited);
    const otherOpts=['<option value="">— No cash payment —</option>']
      .concat(others.map(q=>`<option value="${q.id}">${this.esc(q.name)}</option>`))
      .join('');

    // Estimate net based on chips entered so far (live feedback)
    const bought=p.totalBought;
    const netNote=`<div style="font-size:12px;margin-top:4px;color:var(--muted);">
      Bought ${bought.toLocaleString()} chips — enter chips remaining above, then optionally record cash paid below
    </div>`;

    return`<div class="exit-panel">
      <div class="exit-label">Player exiting — enter remaining chips</div>
      <div class="exit-row">
        <input id="exit${p.id}" type="number" class="inp sm f1" placeholder="Chips remaining"
          oninput="app.state.buyDraft['_exit_chips_'+${p.id}]=this.value">
        <button class="sbtn green" onclick="app.confirmExit(${p.id})">Exit</button>
        <button class="sbtn red" onclick="app.cancelExit()">✕</button>
      </div>
      ${netNote}
      ${others.length?`<div style="margin-top:6px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Paid cash to (optional):</div>
        <div style="display:flex;gap:6px;">
          <select id="exitPayTo${p.id}" class="inp sm f1" style="color:var(--text);">${otherOpts}</select>
          <input id="exitPayAmt${p.id}" type="number" class="inp sm" style="width:80px;" placeholder="₹">
        </div>
      </div>`:''}
    </div>`;
  }
}

// ══ ExpensesRenderer ══════════════════════════════════════════════════════
class ExpensesRenderer extends BaseRenderer {
  render(){
    const blocks=this.state.expenses.map((e,idx)=>this._expenseBlock(e,idx)).join('');
    return`
      ${this.navBar()}
      <div class="body">
        <div style="color:var(--muted);font-size:13px;margin-bottom:10px;">Each expense splits equally among all players. Toggle any player to opt out.</div>
        ${blocks}
        <button class="add-expense-btn" onclick="app.addExpense()">
          <span style="font-size:20px;line-height:1;">+</span> Add Expense
        </button>
      </div>
      <div class="foot">${this.pbtn('See Final Summary →',"app.goTo('summary')")}</div>`;
  }

  _expenseBlock(e,idx){
    const share=e.shareFor(this.state.players);
    const splitN=e.effectiveSplitCount(this.state.players);
    const usingManual=e.splitCount>0;
    const canDelete=this.state.expenses.length>1;
    const playerRows=this.state.players.map(p=>{
      const optedOut=e.isOptedOut(p.id);
      const isPayer=e.paidBy===p.id;
      const net=e.netChargeFor(p.id,this.state.players); // negative = gets reimbursed
      let shareLabel,shareColor;
      if(optedOut){shareLabel='not paying';shareColor='var(--muted)';}
      else if(isPayer&&e.amount>0){
        const reimbursed=e.amount-share;
        shareLabel=`paid ₹${e.amount.toLocaleString()} · gets back ₹${reimbursed.toLocaleString()}`;
        shareColor='var(--amber)';
      } else {
        shareLabel=this.fmt(share);shareColor='var(--muted)';
      }
      return`<div class="expense-player">
        <div class="exp-dot" style="background:${p.color};"></div>
        <div class="exp-pname" style="color:${isPayer?p.color:'var(--text)'};">${this.esc(p.name)}${isPayer?'<span style="font-size:11px;margin-left:4px;color:var(--amber);">★</span>':''}</div>
        <div class="exp-share" style="color:${shareColor};font-size:12px;">${shareLabel}</div>
        ${!isPayer?`<button class="opt-btn ${optedOut?'optout':'paying'}" onclick="app.toggleExpenseOptOut(${e.id},${p.id})">${optedOut?'Opted out':'Paying'}</button>`:''}
      </div>`;
    }).join('');

    // "Paid by" selector
    const paidByOpts=[`<option value="">— Nobody assigned —</option>`]
      .concat(this.state.players.map(p=>`<option value="${p.id}" ${e.paidBy===p.id?'selected':''}>${this.esc(p.name)}</option>`))
      .join('');
    const payer=e.paidBy?this.state.players.find(p=>p.id===e.paidBy):null;
    const payerNote=payer&&e.amount>0
      ?`<div style="font-size:12px;color:var(--amber);margin-top:5px;">
          <span style="color:${payer.color};font-weight:700;">${this.esc(payer.name)}</span> paid ₹${e.amount.toLocaleString()} upfront — others reimburse their share
        </div>`
      :'';

    return`<div class="expense-block">
      <div class="expense-header">
        <div class="f1">
          <div class="tag" style="margin-bottom:3px;">Expense name</div>
          <input class="inp sm" placeholder="${idx===0?'e.g. Room Rent':'e.g. Food, Cab...'}" value="${this.esc(e.name)}"
            oninput="app.state.updateExpense(${e.id},'name',this.value)" onblur="app.onExpenseBlur(${e.id})" style="margin-bottom:8px;">
          <div style="display:flex;gap:12px;margin-bottom:8px;">
            <div style="flex:1;">
              <div class="tag" style="margin-bottom:3px;">Total amount (₹)</div>
              <input type="number" class="inp sm" placeholder="0" value="${e.amount||''}"
                oninput="app.state.updateExpense(${e.id},'amount',this.value)" onblur="app.onExpenseBlur(${e.id})">
            </div>
            <div style="width:72px;">
              <div class="tag" style="margin-bottom:3px;">Split by</div>
              <input type="number" class="inp sm" placeholder="auto" min="1"
                value="${usingManual?e.splitCount:''}"
                oninput="app.state.updateExpense(${e.id},'splitCount',this.value)"
                onblur="app.onExpenseBlur(${e.id})">
            </div>
          </div>
          ${e.amount>0?`<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">÷${splitN} = ${this.fmt(share)} per person</div>`:''}
          <div class="tag" style="margin-bottom:3px;">Who paid upfront?</div>
          <select class="inp sm" onchange="app.state.updateExpense(${e.id},'paidBy',this.value);app.onExpenseBlur(${e.id})"
            style="color:${payer?payer.color:'var(--muted)'};background:var(--bg3);margin-bottom:${payerNote?'4':'0'}px;">
            ${paidByOpts}
          </select>
          ${payerNote}
          ${usingManual?`<div style="font-size:12px;color:var(--muted);margin-top:4px;">÷${e.splitCount} people — toggle below to opt out</div>`:'<div style="font-size:12px;color:var(--muted);margin-top:4px;">Leave blank to split by opt-out list below</div>'}
        </div>
        ${canDelete?`<button class="expense-del" onclick="app.removeExpense(${e.id})" title="Remove">✕</button>`:''}
      </div>
      ${e.amount>0?`<div class="expense-players">${playerRows}</div>`:''}
    </div>`;
  }
}

// ══ SummaryRenderer ═══════════════════════════════════════════════════════
class SummaryRenderer extends BaseRenderer {
  render(){
    const results=GameEngine.computeResults(this.state);
    const balance=GameEngine.getBalanceStatus(this.state);
    const activePlayers=this.state.activePlayers;
    const inputs=activePlayers.map(p=>{
      const chips=parseInt(this.state.chipDraft[p.id])||0;
      const rate=this.state.chipRate||0.5;
      const expShare=this.state.totalExpenseShareFor(p.id);
      const chipsEntered=!!this.state.chipDraft[p.id];
      const netChips=chips-p.totalBought;
      const chipsRupees=Math.round(netChips*rate);
      const finalNet=chipsRupees-expShare;
      const expLine=expShare!==0
        ?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;">
            <span>${expShare<0?'Expense credit (paid upfront)':'Expense share'}</span>
            <span style="color:${expShare<0?'var(--amber)':'var(--red)'};">${expShare<0?'+':'-'}${this.fmt(Math.abs(expShare))}</span>
          </div>`:'';
      const calcBlock=chipsEntered?`
        <div style="background:var(--bg3);border-radius:8px;padding:7px 10px;margin-top:6px;border:1px solid var(--brd);">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;">
            <span>Chips remaining × ₹${rate}/chip</span>
            <span>${chips.toLocaleString()} × ${rate} = ${this.fmt(Math.round(chips*rate))}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;">
            <span>Bought</span>
            <span>- ${this.fmt(Math.round(p.totalBought*rate))}</span>
          </div>
          ${expLine}
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:5px;margin-top:4px;border-top:1px solid var(--brd);">
            <span style="color:var(--muted);">Net</span>
            <span style="color:${finalNet>0?'var(--green2)':finalNet<0?'var(--red)':'var(--muted)'};">${finalNet>=0?'+':''}${this.fmt(Math.abs(finalNet))}</span>
          </div>
        </div>`:'<div id="rp${p.id}" style="font-size:12px;color:var(--muted);margin-top:4px;">enter chips to see breakdown</div>';
      return this.card(`
      <div class="row" style="margin-bottom:6px;">
        <div style="width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0;"></div>
        <div class="f1"><div style="color:var(--text);font-size:15px;font-weight:700;">${this.esc(p.name)}</div></div>
        <div style="color:var(--muted);font-size:13px;">Bought ${p.totalBought.toLocaleString()} chips</div>
      </div>
      <input id="cp${p.id}" type="number" class="inp sm" placeholder="Chips remaining" value="${this.esc(this.state.chipDraft[p.id]||'')}">
      ${calcBlock}`);
    }).join('');

    const exitedSection=this.state.players.filter(p=>p.exited).map(p=>
      this.card(`<div class="row"><div style="width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0;"></div><div class="f1" style="font-size:15px;color:#8a7a7a;">${this.esc(p.name)} <span class="exited-badge">exited</span></div><div style="color:#6a5a5a;font-size:14px;">${p.exitChips.toLocaleString()} chips = ${this.fmt(Math.round(p.exitChips*this.state.chipRate))}</div></div>`)
    ).join('');

    return`
      ${this.navBar()}
      <div class="body">
        <div class="stat-grid">
          <div class="stat-card">${this.tag('In Play')}<div class="stat-val" style="font-size:18px;">${this.state.totalInPlay.toLocaleString()}<span style="font-size:13px;color:var(--muted);font-weight:400;"> chips</span></div></div>
          <div class="stat-card">${this.tag('Players')}<div class="stat-val">${this.state.players.length}</div></div>
        </div>
        ${this._expenseSummary()}
        ${this._balanceBar(balance)}
        ${activePlayers.length?`<div class="tag" style="margin-top:4px;">Enter Remaining Chips</div>`:''}
        ${inputs}
        ${exitedSection}
        <div style="margin:5px 0 10px;" id="calc-wrap"><button onclick="app.doPayout()" id="calc-btn" class="pbtn${app._calcEnabled()?'':' off'}">Calculate Payouts</button></div>
        ${this.state.showPayout?this._payoutSection(results):''}
        <div style="height:10px;"></div>
      </div>
      <div class="foot">${this.pbtn('New Game ↺','app.confirmNewGame()',{color:'#E9A23B'})}</div>`;
  }

  _expenseSummary(){
    const nonZero=this.state.expenses.filter(e=>e.amount>0);
    if(!nonZero.length)return'';
    const total=nonZero.reduce((s,e)=>s+e.amount,0);
    return`<div style="background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:9px 12px;margin-bottom:10px;">
      <div class="tag">Expenses</div>
      ${nonZero.map(e=>{
        const payer=e.paidBy?this.state.players.find(p=>p.id===e.paidBy):null;
        return`<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding:3px 0;">
          <span>${this.esc(e.name)||'Expense'}${payer?`<span style="font-size:12px;color:${payer.color};margin-left:5px;">(paid by ${this.esc(payer.name)})</span>`:''}</span>
          <span style="color:var(--text);">${this.fmt(e.amount)}</span>
        </div>`;
      }).join('')}
      <div style="display:flex;justify-content:space-between;font-size:14px;padding-top:6px;margin-top:4px;border-top:1px solid var(--brd);"><span style="color:var(--muted);">Total</span><span style="color:var(--gold);font-weight:700;">${this.fmt(total)}</span></div>
    </div>`;
  }

  _balanceBar(b){
    if(b.status==='empty')return'';
    const isMismatch=b.status==='mismatch';
    const isSurplus=b.diff>0;
    const settled=this.state.forceSettle;
    const adjRate=isMismatch?GameEngine.getAdjustedRate(this.state):this.state.chipRate;


    const cfgs={
      waiting:{cls:'partial',icon:'○',tc:'var(--muted)',sc:'var(--muted)',
        title:`Enter chips — need ${this.state.totalInPlay.toLocaleString()} total`,
        sub:`0/${this.state.activePlayers.length} players filled`},
      partial:{cls:'partial',icon:'…',tc:'var(--amber)',sc:'var(--muted)',
        title:`Running total: ${this.state.totalChipsEntered.toLocaleString()} chips`,
        sub:`Need ${this.state.totalInPlay.toLocaleString()} · ${this.state.filledChipCount}/${this.state.activePlayers.length} filled`},
      balanced:{cls:'ok',icon:'✓',tc:'#6FD46F',sc:'var(--green)',
        title:'Chips balanced',
        sub:`${this.state.totalChipsEntered.toLocaleString()} remaining = ${this.state.totalInPlay.toLocaleString()} in play`},
      mismatch:{cls:'bad',icon:'⚠',tc:'var(--red)',sc:'var(--muted)',
        title:`Mismatch ${b.diff>0?'+':''}${Math.abs(b.diff).toLocaleString()} chips`,
        sub:(()=>{
          if(!settled)return`${this.state.totalChipsEntered.toLocaleString()} counted vs ${this.state.totalInPlay.toLocaleString()} in play`;
          const r=GameEngine._getRates(this.state);
          return r.isSurplus
            ?`Force settle ON · all at ₹${r.surplusRate.toFixed(3)}/chip`
            :`Force settle ON · losers ₹${this.state.chipRate}/chip · winners ₹${r.winnerRate.toFixed(3)}/chip`;
        })()},
    };
    const c=cfgs[b.status]||cfgs.waiting;

    // "Force Settle" label sits above the toggle, toggle is always visible on mismatch
    const toggleBlock=isMismatch?`
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;">
        <span style="font-size:10px;color:var(--muted);white-space:nowrap;">Force Settle</span>
        <label class="toggle" style="cursor:pointer;">
          <input type="checkbox" ${settled?'checked':''} onchange="app.onForceSettleToggle(this.checked)">
          <div class="toggle-track" style="${settled?'background:var('+(isSurplus?'--amber':'--red')+');':''}"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>`:'';

    return`<div class="balbar ${c.cls}" id="balbar" style="display:flex;align-items:center;gap:8px;padding:5px 9px;">
      <div style="font-size:16px;flex-shrink:0;">${c.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="color:${c.tc};font-size:12px;font-weight:700;">${c.title}</div>
        <div style="color:${c.sc};font-size:11px;margin-top:1px;">${c.sub}</div>
      </div>
      ${toggleBlock}
    </div>`;
  }

  _payoutSection(results){
    const T=GameEngine.computeTransfers(results, this.state.exitPayments||[]);
    const rCards=results.map(r=>this.card(`
      <div class="row">
        <div style="width:8px;height:8px;border-radius:50%;background:${r.color};flex-shrink:0;"></div>
        <div class="f1" style="padding-left:4px;">
          <div style="color:var(--text);font-size:15px;font-weight:700;">${this.esc(r.name)}${r.exited?`<span class="exited-badge">exited</span>`:''}</div>
          <div style="color:var(--muted);font-size:12px;">Bought ${r.bought.toLocaleString()} chips · Left ${r.chipsRemaining.toLocaleString()} chips${r.expenseShare!==0?` · Exp ${r.expenseShare<0?'<span style="color:var(--amber)">+'+this.fmt(Math.abs(r.expenseShare))+'</span>':this.fmt(r.expenseShare)}`:''}</div>
        </div>
        <div style="text-align:right;">
          <div style="color:${r.netColor};font-size:20px;font-weight:700;">${r.netFormatted}</div>
          <div style="font-size:12px;color:${r.labelColor};">${r.label}</div>
        </div>
      </div>`,`border-color:${r.borderColor}`)).join('');

    const tCards=T.length?T.map(t=>{
      const key=`${t.from}→${t.to}`;
      const paid=!!(this.state.paidTransfers&&this.state.paidTransfers[key]);
      return`<div class="transfer-card ${paid?'paid-card':''}">
        <div class="row" style="padding:10px 12px;">
          <div style="width:8px;height:8px;border-radius:50%;background:${t.fromColor};flex-shrink:0;"></div>
          <div style="color:var(--amber);font-size:16px;font-weight:700;padding:0 6px;">→</div>
          <div style="width:8px;height:8px;border-radius:50%;background:${t.toColor};flex-shrink:0;"></div>
          <div class="f1" style="padding-left:6px;font-size:14px;color:var(--text);">
            <span style="color:${t.fromColor};">${this.esc(t.from)}</span> pays <span style="color:${t.toColor};">${this.esc(t.to)}</span>
          </div>
          <div style="color:${paid?'var(--muted)':'var(--gold)'};font-size:18px;font-weight:700;${paid?'text-decoration:line-through;':''}">${this.fmt(t.amount)}</div>
        </div>
        <div class="paid-toggle" onclick="app.togglePaid('${key}')">
          <div class="paid-check${paid?' done':''}${paid?' ✓':''}">${paid?'✓':''}</div>
          <span class="paid-label${paid?' done':''}">${paid?'Paid ✓':'Mark as paid'}</span>
        </div>
      </div>`;
    }).join('')
    :this.card(`<div style="text-align:center;color:var(--green2);font-size:15px;padding:5px 0;">All settled — no transfers needed!</div>`);

    const allPaid=T.length>0&&T.every(t=>this.state.paidTransfers&&this.state.paidTransfers[`${t.from}→${t.to}`]);
    const banner=allPaid?`<div style="text-align:center;background:var(--bg2);border:1px solid var(--brd2);border-radius:10px;padding:10px;margin-top:8px;color:var(--green2);font-size:14px;font-weight:700;">🎉 All payments settled!</div>`:'';

    // Show already-settled exit payments for reference
    const eps=this.state.exitPayments||[];
    const epSection=eps.length?`
      <div class="tag" style="margin-top:12px;">Already Settled at Exit</div>
      ${eps.map(ep=>this.card(`
        <div class="row">
          <div style="font-size:13px;color:var(--muted);">${this.esc(ep.fromName)} paid <span style="color:var(--gold);font-weight:700;">${this.fmt(ep.amount)}</span> cash to <span style="color:var(--green2);">${this.esc(ep.toName)}</span></div>
          <div style="font-size:12px;color:var(--muted);margin-left:auto;flex-shrink:0;">${ep.time}</div>
        </div>
      `,'border-color:var(--brd2);opacity:.7')).join('')}
    `:'';

    return`<div class="tag" style="margin-top:12px;">Results</div>${rCards}<div class="tag" style="margin-top:12px;">Who Pays Whom</div>${tCards}${banner}${epSection}`;
  }
}

// ══ EventBinder ═══════════════════════════════════════════════════════════
class EventBinder {
  constructor(app){this.app=app;}
  bind(){
    // mno/mok are dynamically injected — bind only if present
    const mno=document.getElementById('mno'),mok=document.getElementById('mok');
    if(mno)mno.onclick=()=>this.app.hideModal();
    if(mok)mok.onclick=()=>{this.app.hideModal();this.app.resetGame();};
    switch(this.app.state.screen){
      case SCREENS.SETUP:    this._setup();    break;
      case SCREENS.GAME:     this._game();     break;
      case SCREENS.SUMMARY:  this._summary();  break;
    }
  }
  _setup(){
    const ni=document.getElementById('ni');if(!ni)return;
    ni.focus();
    ni.oninput=e=>{this.app.state.newName=e.target.value;};
    ni.onkeydown=e=>{if(e.key==='Enter')this.app.addPlayer();};
    const rc=document.getElementById('resume-code');
    if(rc)rc.onkeydown=e=>{if(e.key==='Enter')this.app.resumeByCode();};
    const cr=document.getElementById('chip-rate');
    if(cr){cr.oninput=e=>{this.app.state.chipRate=parseFloat(e.target.value)||0.5;};cr.onblur=()=>{this.app.scheduleSync();this.app.render();}; }
  }
  _game(){
    this.app.state.players.forEach(p=>{
      const bi=document.getElementById('bi'+p.id);
      if(bi){bi.oninput=e=>{this.app.state.buyDraft[p.id]=e.target.value;};bi.onkeydown=e=>{if(e.key==='Enter')this.app.addBuy(p.id);};}
      const ex=document.getElementById('exit'+p.id);
      if(ex)ex.onkeydown=e=>{if(e.key==='Enter')this.app.confirmExit(p.id);};
    });
  }
  _summary(){
    this.app.state.activePlayers.forEach(p=>{
      const inp=document.getElementById('cp'+p.id);if(!inp)return;
      inp.oninput=e=>{
        this.app.state.chipDraft[p.id]=e.target.value;
        this.app.updateBalanceLive();
        // Re-render just this player's calc block
        const chips=parseInt(e.target.value)||0;
        const rate=this.app.state.chipRate||0.5;
        const expShare=this.app.state.totalExpenseShareFor(p.id);
        const netChips=chips-p.totalBought;
        const chipsRupees=Math.round(netChips*rate);
        const finalNet=chipsRupees-expShare;
        const fmt=n=>'₹'+Math.abs(n).toLocaleString();
        const expLine=expShare!==0
          ?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;"><span>${expShare<0?'Expense credit':'Expense share'}</span><span style="color:${expShare<0?'var(--amber)':'var(--red)'};">${expShare<0?'+':'-'}${fmt(Math.abs(expShare))}</span></div>`
          :'';
        const newBlock=chips
          ?`<div style="background:var(--bg3);border-radius:8px;padding:7px 10px;margin-top:6px;border:1px solid var(--brd);">
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;"><span>Chips remaining × ₹${rate}/chip</span><span>${chips.toLocaleString()} × ${rate} = ${fmt(Math.round(chips*rate))}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:1px 0;"><span>Bought</span><span>- ${fmt(Math.round(p.totalBought*rate))}</span></div>
              ${expLine}
              <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:5px;margin-top:4px;border-top:1px solid var(--brd);"><span style="color:var(--muted);">Net</span><span style="color:${finalNet>0?'var(--green2)':finalNet<0?'var(--red)':'var(--muted)'};">${finalNet>=0?'+':''}${fmt(Math.abs(finalNet))}</span></div>
            </div>`
          :'<div style="font-size:12px;color:var(--muted);margin-top:4px;">enter chips to see breakdown</div>';
        const rp=document.getElementById('rp'+p.id);
        const calcEl=inp.nextElementSibling;
        if(calcEl&&calcEl!==rp){
          calcEl.innerHTML=newBlock;
        } else if(rp){
          rp.innerHTML=newBlock;
        }
      };inp.onblur=()=>{this.app.scheduleSync();};
    });
  }
}

// ══ PokerApp ══════════════════════════════════════════════════════════════
class PokerApp {
  constructor(){
    this.state=new GameState();
    this.cloud=new CloudStore();
    this.binder=new EventBinder(this);
    this._R={
      [SCREENS.SETUP]:SetupRenderer,
      [SCREENS.GAME]:GameRenderer,
      [SCREENS.EXPENSES]:ExpensesRenderer,
      [SCREENS.SUMMARY]:SummaryRenderer,
    };
  }

  mount(){
    this._root=document.getElementById('app');
    const local=GameState.loadLocal();
    if(local&&local.gameCode&&local.data){
      this.state.fromJSON(local.data);this.cloud.gameCode=local.gameCode;this.cloud.blobId=local.blobId||null;this._syncBar('ok');
    }
    this.render();
  }

  render(){
    if(!this._root)return;
    this._root.innerHTML=new(this._R[this.state.screen]||SetupRenderer)(this.state).render();
    this.binder.bind();
    this._refreshCodeDisplay();
  }

  goTo(screen){this.state.screen=screen;this.state.showPayout=false;this.scheduleSync();this.render();}

  // Players
  addPlayer(){if(this.state.addPlayer()){this.scheduleSync();this.render();}}
  removePlayer(id){this.state.removePlayer(id);this.scheduleSync();this.render();}

  // Buys
  addBuy(pid){if(this.state.addBuy(pid)){this.scheduleSync();this.render();}}
  addBuyPrompt(pid){
    // expand the row and focus the input
    this.state.expandedPlayer=pid;
    this.scheduleSync();this.render();
    setTimeout(()=>{const inp=document.getElementById('bi'+pid);if(inp)inp.focus();},50);
  }
  removeBuy(pid,bid){this.state.removeBuy(pid,bid);this.scheduleSync();this.render();}
  toggleExpand(pid){
    this.state.expandedPlayer=this.state.expandedPlayer===pid?null:pid;
    this.render();
  }

  // Player exit
  startExit(pid){
    this.state.expandedPlayer=pid;
    this.state.exitingPlayer=pid;
    this.render();
    setTimeout(()=>{const inp=document.getElementById('exit'+pid);if(inp)inp.focus();},50);
  }
  cancelExit(){this.state.exitingPlayer=null;this.render();}
  startEditExit(pid){
    this.state.expandedPlayer=pid;
    this.state.editingExitPlayer=pid;
    this.render();
    setTimeout(()=>{ const i=document.getElementById('exitedit'+pid); if(i){i.focus();i.select();} },50);
  }
  cancelEditExit(){
    this.state.editingExitPlayer=null;
    this.render();
  }
  confirmEditExit(pid){
    const inp=document.getElementById('exitedit'+pid);
    const chips=parseInt(inp?inp.value:'0')||0;
    const payToEl=document.getElementById('exitEditPayTo'+pid);
    const payAmtEl=document.getElementById('exitEditPayAmt'+pid);
    const payToId=payToEl&&payToEl.value?parseInt(payToEl.value):null;
    const payAmt=payAmtEl?parseInt(payAmtEl.value)||0:0;
    // Undo exit first (restores player as active, removes old payment)
    this.state.undoExit(pid);
    // Re-exit with corrected values
    this.state.exitPlayer(pid, chips, payToId, payAmt);
    this.state.editingExitPlayer=null;
    this.scheduleSync();
    this.render();
    const name=this.state.getPlayer(pid)?.name||'Player';
    const payMsg=payToId&&payAmt>0?` · paid ₹${payAmt.toLocaleString()} to ${this.state.getPlayer(payToId)?.name||''}`:'' ;
    this.toast(`${name} exit updated${payMsg}`);
  }
  confirmExit(pid){
    const inp=document.getElementById('exit'+pid);
    const chips=parseInt(inp?inp.value:0)||0;
    const payToEl=document.getElementById('exitPayTo'+pid);
    const payAmtEl=document.getElementById('exitPayAmt'+pid);
    const payToId=payToEl&&payToEl.value?parseInt(payToEl.value):null;
    const payAmt=payAmtEl?parseInt(payAmtEl.value)||0:0;
    // Clean up temp draft key
    delete this.state.buyDraft['_exit_chips_'+pid];
    this.state.exitPlayer(pid, chips, payToId, payAmt);
    this.scheduleSync();
    this.render();
    const name=this.state.getPlayer(pid)?.name||'Player';
    const payMsg=payToId&&payAmt>0?` · paid ₹${payAmt.toLocaleString()} to ${this.state.getPlayer(payToId)?.name||''}`:'' ;
    this.toast(`${name} exited${payMsg}`);
  }

  // Expenses
  addExpense(){this.state.addExpense();this.scheduleSync();this.render();}
  removeExpense(id){this.state.removeExpense(id);this.scheduleSync();this.render();}
  // Update state immediately (for live re-render of share amounts) but don't sync yet
  updateExpenseDraft(id,field,value){this.state.updateExpense(id,field,value);this.render();}
  // Sync only when the user leaves the field (blur)
  onExpenseBlur(id){this.render();this.scheduleSync();}
  toggleExpenseOptOut(expId,pid){this.state.toggleExpenseOptOut(expId,pid);this.scheduleSync();this.render();}

  // Payout
  doPayout(){
    if(!this._calcEnabled())return;
    this.state.showPayout=true;this.scheduleSync();this.render();
    setTimeout(()=>{const b=this._root.querySelector('.body');if(b)b.scrollTop=b.scrollHeight;},80);
  }
  _calcEnabled(){
    const active=this.state.activePlayers;
    if(active.length>0&&!this.state.allChipsFilled)return false;
    const b=GameEngine.getBalanceStatus(this.state);
    if(b.status==='mismatch'&&!this.state.forceSettle)return false;
    return true;
  }

  updateBalanceLive(){
    const b=GameEngine.getBalanceStatus(this.state);
    const r=new SummaryRenderer(this.state);
    // Rebuild balance bar + settle bar atomically
    const el=document.getElementById('balbar');
    if(el){
      const tmp=document.createElement('div');
      tmp.innerHTML=r._balanceBar(b);
      // Remove stale settle-bar before inserting new content
      // settle toggle is now inside balbar itself — no separate element to remove
      // Replace balbar with new nodes
      const parent=el.parentNode;
      const ref=el.nextSibling;
      el.remove();
      while(tmp.firstChild)parent.insertBefore(tmp.firstChild,ref);
    }
    // Update calc button enabled state
    const btn=document.getElementById('calc-btn');
    if(btn)btn.className='pbtn'+(this._calcEnabled()?'':' off');
  }

  // Resume
  async resumeByCode(){
    const inp=document.getElementById('resume-code');
    const code=(inp?inp.value.trim():'');
    if(!code){this.toast('Enter a game code first','err');return;}
    this.toast('Loading…');
    try{
      const data=await this.cloud.read(code);
      this.state.fromJSON(data);
      this.cloud.gameCode=code;
      // Restore blobId if this code matches local cache
      const local=GameState.loadLocal();
      if(local&&local.gameCode===code&&local.blobId) this.cloud.blobId=local.blobId;
      this.state.saveLocal(code,this.cloud.blobId);
      this._syncBar('ok');this.render();this.toast('Game resumed ✓');
    }catch(e){
      console.error('Resume error:',e);
      this.toast('Code not found — check the code and try again','err');
    }
  }

  async copyCode(){
    const id=this.cloud.gameCode;if(!id)return;
    try{await navigator.clipboard.writeText(id);this.toast('Code copied!');}
    catch(e){this.toast(id);}
  }

  scheduleSync(){
    this._syncBar('syncing');
    this.cloud.schedule(
      this.state.toJSON(),
      ()   => this._syncBar('syncing'),
      (id) => { this.state.saveLocal(id); this._syncBar('ok'); this._refreshCodeDisplay(); },
      ()   => this._syncBar('err'),
    );
  }

  _syncBar(status){
    const dot=document.getElementById('sync-dot');
    if(!dot)return;
    const cls={cloud:'ok',syncing:'spin',err:'err',local:'ok',none:'ok',ok:'ok'};
    dot.className='dot '+(cls[status]||'ok');
  }

  _refreshCodeDisplay(){
    const pill=document.getElementById('code-pill-wrap');
    const noCode=document.getElementById('no-code-label');
    const disp=document.getElementById('code-display');
    if(!pill)return;
    if(this.cloud.gameCode){
      pill.style.display='inline-flex';if(noCode)noCode.style.display='none';
      if(disp)disp.textContent=this.cloud.gameCode;
    }else{pill.style.display='none';if(noCode)noCode.style.display='block';}
  }

  onChipRateInput(v){this.state.chipRate=parseFloat(v)||0.5;}
  onForceSettleToggle(checked){
    if(checked){
      const m=document.getElementById('modal');
      const b=GameEngine.getBalanceStatus(this.state);
      const rates=GameEngine._getRates(this.state);
      const isSurplus=rates.isSurplus;
      const nom=this.state.chipRate;
      const ti=this.state.totalInPlay;
      const tr=this.state.totalChipsEntered;
      const diff=Math.abs(b.diff);
      const fmt=n=>'₹'+Math.abs(Math.round(n)).toLocaleString();
      const fmtR=r=>r.toFixed(4);

      // Before: everyone at nominal rate
      const nomResults=GameEngine.computeResultsWithRate(this.state,nom,nom);
      // After: apply the correct case
      const adjResults=GameEngine.computeResultsWithRate(this.state,rates.nomRate,rates.winnerRate);

      // Summary line explaining the method
      const shortageChips=isSurplus?0:(ti-tr);
      let totalWinChips=0;
      this.state.players.forEach(p=>{const net=this.state.chipsFor(p.id)-p.totalBought;if(net>0)totalWinChips+=net;});
      const methodNote=isSurplus
        ?`All chips worth less: ₹${(ti*nom).toLocaleString()} pot ÷ ${tr.toLocaleString()} chips counted = ₹${fmtR(rates.surplusRate)}/chip for everyone`
        :`Losers pay ₹${nom}/chip (unchanged). Winners absorb the ${shortageChips.toLocaleString()}-chip shortfall proportionally:\nWinner rate = ₹${nom}/chip × (${totalWinChips} win chips − ${shortageChips} missing) ÷ ${totalWinChips} win chips = ₹${fmtR(rates.winnerRate)}/chip`;

      const rows=this.state.players.map(p=>{
        const before=nomResults.find(r=>r.id===p.id);
        const after=adjResults.find(r=>r.id===p.id);
        if(!before||!after)return'';
        const delta=after.netRupees-before.netRupees;
        const isWinner=before.netRupees>0;
        const deltaStr=delta===0?'—':(delta>0?'+':'')+fmt(delta);
        const role=isWinner?'<span style="font-size:11px;color:var(--amber);">winner</span>':'<span style="font-size:11px;color:var(--muted);">loser</span>';
        return`<tr>
          <td style="padding:6px 8px;">
            <div style="display:flex;align-items:center;gap:5px;">
              <div style="width:7px;height:7px;border-radius:50%;background:${p.color};flex-shrink:0;"></div>
              <span style="font-size:13px;">${esc(p.name)}</span>
            </div>
            <div style="padding-left:12px;">${role}</div>
          </td>
          <td style="padding:6px 8px;font-size:13px;color:${before.netRupees>=0?'var(--green2)':'var(--red)'};">${before.netFormatted}</td>
          <td style="padding:6px 8px;font-size:13px;color:${after.netRupees>=0?'var(--green2)':'var(--red)'};">${after.netFormatted}</td>
          <td style="padding:6px 8px;font-size:12px;color:${delta<0?'var(--red)':delta>0?'var(--green2)':'var(--muted)'};">${deltaStr}</td>
        </tr>`;
      }).join('');

      m.innerHTML=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;justify-content:flex-start;z-index:200;padding:16px;overflow:hidden;" onclick="app.cancelForceSettle()">
        <div class="${isSurplus?'warn-modal surplus':'warn-modal'}" onclick="event.stopPropagation()" style="border-color:${isSurplus?'var(--amber)':'var(--red)'};flex:1;display:flex;flex-direction:column;overflow:hidden;">
          <h3 style="color:${isSurplus?'var(--amber)':'var(--red)'};">
            ${isSurplus?'⚠ Chip Surplus':'⚠ Chip Shortage'} — ${diff.toLocaleString()} chips
          </h3>
          <p class="warn-intro">
            ${isSurplus
              ?`${diff.toLocaleString()} extra chips counted — not backed by real money.`
              :`${diff.toLocaleString()} chips missing — winners share the shortfall.`
            }
          </p>
          <div class="warn-note" style="margin-bottom:10px;">${methodNote}</div>
          <table class="warn-table" style="margin-bottom:12px;">
            <tr><th style="padding:5px 8px;">Player</th><th style="padding:5px 8px;">Before</th><th style="padding:5px 8px;">After</th><th style="padding:5px 8px;">Δ</th></tr>
            ${rows}
          </table>
          <div class="mrow">
            <button class="mno" onclick="app.cancelForceSettle()">Cancel</button>
            <button class="mok" style="background:${isSurplus?'var(--amber)':'var(--red)'};" onclick="app.confirmForceSettle()">Apply</button>
          </div>
        </div>
      </div>`;
      m.style.display='flex';
    } else {
      this.state.forceSettle=false;
      this.scheduleSync();
      this.render();
      this.toast('Reverted to original values');
    }
  }
  cancelForceSettle(){
    this.state.forceSettle=false;
    document.getElementById('modal').style.display='none';
    document.getElementById('modal').innerHTML='';
    this.render(); // re-render so toggle reverts to off
  }
  confirmForceSettle(){
    this.state.forceSettle=true;
    document.getElementById('modal').style.display='none';
    document.getElementById('modal').innerHTML='';
    this.scheduleSync();
    this.render();
    this.toast('Proportional adjustment applied');
  }
  togglePaid(key){
    if(!this.state.paidTransfers) this.state.paidTransfers={};
    this.state.paidTransfers[key]=!this.state.paidTransfers[key];
    this.scheduleSync();this.render();
    setTimeout(()=>{const b=this._root.querySelector('.body');if(b)b.scrollTop=b.scrollHeight;},50);
  }
  onChipRateBlur(){this.scheduleSync();this.render();}
  confirmNewGame(){
    const m=document.getElementById('modal');
    m.innerHTML=`<div class="modal"><h3>Start New Game?</h3><p>Game will be cleared locally and from cloud.</p><div class="mrow"><button class="mno" id="mno">Cancel</button><button class="mok" id="mok">Yes, Reset</button></div></div>`;
    m.style.display='flex';
    document.getElementById('mno').onclick=()=>this.hideModal();
    document.getElementById('mok').onclick=()=>{this.hideModal();this.resetGame();};
  }
  hideModal(){const m=document.getElementById('modal');m.style.display='none';}
  resetGame(){
    this.state.reset();this.cloud.gameCode=null;
    try{localStorage.removeItem(LOCAL_KEY);}catch(e){}
    this._syncBar('none');this.render();
  }

  toast(msg,type=''){
    const area=document.getElementById('toast-area');if(!area)return;
    area.innerHTML='';
    const el=document.createElement('div');
    el.className='toast'+(type?' '+type:'');el.textContent=msg;
    area.appendChild(el);
    setTimeout(()=>{if(area.contains(el))area.removeChild(el);},2800);
  }
}

const app=new PokerApp();
document.addEventListener('DOMContentLoaded',()=>app.mount());
</script>
